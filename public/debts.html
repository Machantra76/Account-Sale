<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគ្រប់គ្រងបំណុល (Debts Management)</title>
    <!-- Google Fonts: Battambang & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Battambang', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen p-4 md:p-8">
    <div class="max-w-7xl mx-auto bg-white shadow-xl rounded-2xl overflow-hidden border border-slate-100">
        
        <!-- Header Section -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 px-6 py-5 text-white flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    <span>📋</span> ប្រព័ន្ធគ្រប់គ្រងការជំពាក់ប្រាក់ (AR / AP)
                </h1>
                <p class="text-blue-100 text-sm mt-1">គ្រប់គ្រងអតិថិជនជំពាក់ និងប្រាក់ត្រូវសងគេប្រកបដោយភាពងាយស្រួល</p>
            </div>
        </div>

        <div class="p-6 md:p-8">
            <!-- Form បន្ថែមបំណុលថ្មី -->
            <form id="debtForm" class="bg-slate-50 border border-slate-200/80 p-5 rounded-xl mb-8 shadow-sm grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-4 items-end">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">ប្រភេទបំណុល</label>
                    <select id="debt_type" class="w-full bg-white border border-slate-300 p-2.5 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="RECEIVABLE">អតិថិជនជំពាក់ (AR)</option>
                        <option value="PAYABLE">យើងជំពាក់គេ (AP)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">ឈ្មោះភាគីពាក់ព័ន្ធ</label>
                    <input type="text" id="partner_name" placeholder="ឈ្មោះអតិថិជន / ក្រុមហ៊ុន" class="w-full bg-white border border-slate-300 p-2.5 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">លេខវិក្កយបត្រ (Invoice)</label>
                    <input type="text" id="reference_id" placeholder="ឧ. INV-001" class="w-full bg-white border border-slate-300 p-2.5 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">ទឹកប្រាក់សរុប ($)</label>
                    <input type="number" id="total_amount" placeholder="0.00" step="0.01" class="w-full bg-white border border-slate-300 p-2.5 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">បង់មុន ($)</label>
                    <input type="number" id="paid_amount" placeholder="0.00" step="0.01" class="w-full bg-white border border-slate-300 p-2.5 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" value="0">
                </div>
                <div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold p-2.5 rounded-lg transition-all duration-200 shadow-md shadow-blue-500/20 flex items-center justify-center gap-2">
                        <span>💾</span> រក្សាទុក
                    </button>
                </div>
            </form>

            <!-- តារាងបង្ហាញបញ្ជីបំណុល -->
            <div class="overflow-x-auto rounded-xl border border-slate-200">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100/70 text-slate-700 text-xs uppercase tracking-wider font-semibold border-b border-slate-200 text-center">
                            <th class="p-3.5">ប្រភេទ</th>
                            <th class="p-3.5">ឈ្មោះ</th>
                            <th class="p-3.5">លេខវិក្កយបត្រ</th>
                            <th class="p-3.5">ទឹកប្រាក់សរុប</th>
                            <th class="p-3.5">បានបង់រួច</th>
                            <th class="p-3.5">នៅសល់</th>
                            <th class="p-3.5">ស្ថានភាព</th>
                            <th class="p-3.5">សកម្មភាព</th>
                        </tr>
                    </thead>
                    <tbody id="debtTableBody" class="divide-y divide-slate-200 text-sm">
                        <!-- ទិន្នន័យទាញមកបង្ហាញទីនេះ -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        async function loadDebts() {
            try {
                const res = await fetch(`${API_BASE}/api/accounting/debts`);
                const result = await res.json();
                if (result.success) {
                    const tbody = document.getElementById('debtTableBody');
                    tbody.innerHTML = '';
                    if (result.data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="8" class="text-center p-6 text-slate-400">មិនទាន់មានទិន្នន័យបំណុលនៅឡើយទេ</td></tr>`;
                        return;
                    }
                    result.data.forEach(d => {
                        let statusBadge = d.status;
                        if (d.status === 'PAID') {
                            statusBadge = `<span class="bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-full text-xs font-bold inline-flex items-center gap-1">🟢 បានសងរួច (PAID)</span>`;
                        } else if (d.status === 'PARTIAL') {
                            statusBadge = `<span class="bg-amber-50 text-amber-700 border border-amber-200 px-3 py-1 rounded-full text-xs font-bold inline-flex items-center gap-1">🟡 សងខ្លះ (PARTIAL)</span>`;
                        } else {
                            statusBadge = `<span class="bg-rose-50 text-rose-700 border border-rose-200 px-3 py-1 rounded-full text-xs font-bold inline-flex items-center gap-1">🔴 មិនទាន់បង់ (UNPAID)</span>`;
                        }

                        let payButton = d.status !== 'PAID' 
                            ? `<button onclick="makePayment(${d.id})" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition-colors shadow-sm">បង់ប្រាក់</button>` 
                            : '';

                        tbody.innerHTML += `
                            <tr class="hover:bg-slate-50/80 transition-colors text-center">
                                <td class="p-3.5 font-medium text-slate-700">${d.debt_type}</td>
                                <td class="p-3.5 font-semibold text-slate-900">${d.partner_name}</td>
                                <td class="p-3.5 text-slate-600 font-mono">${d.reference_id || '-'}</td>
                                <td class="p-3.5 font-semibold text-slate-800">$${Number(d.total_amount).toFixed(2)}</td>
                                <td class="p-3.5 text-emerald-600 font-semibold">$${Number(d.paid_amount).toFixed(2)}</td>
                                <td class="p-3.5 text-rose-600 font-bold">$${Number(d.remaining_amount).toFixed(2)}</td>
                                <td class="p-3.5">${statusBadge}</td>
                                <td class="p-3.5 flex justify-center items-center gap-1.5">
                                    ${payButton}
                                    <button onclick="deleteDebt(${d.id})" class="bg-slate-100 hover:bg-rose-100 text-slate-600 hover:text-rose-700 px-3 py-1.5 rounded-lg text-xs font-medium transition-colors">លុប</button>
                                </td>
                            </tr>
                        `;
                    });
                }
            } catch (err) {
                console.error("Error loading debts:", err);
            }
        }

        document.getElementById('debtForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                debt_type: document.getElementById('debt_type').value,
                partner_name: document.getElementById('partner_name').value,
                reference_id: document.getElementById('reference_id').value,
                total_amount: document.getElementById('total_amount').value,
                paid_amount: document.getElementById('paid_amount').value || 0
            };

            const res = await fetch(`${API_BASE}/api/accounting/debts`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await res.json();
            if (result.success) {
                document.getElementById('debtForm').reset();
                document.getElementById('paid_amount').value = '0';
                loadDebts();
            } else {
                alert('Error: ' + result.error);
            }
        });

        async function makePayment(id) {
            const amountStr = prompt("សូមបញ្ចូលចំនួនទឹកប្រាក់ដែលត្រូវបង់សងបន្ថែម ($):");
            if (!amountStr) return;
            const amountPaid = parseFloat(amountStr);

            if (isNaN(amountPaid) || amountPaid <= 0) {
                alert("សូមបញ្ចូលទឹកប្រាក់ឱ្យបានត្រឹមត្រូវ!");
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/api/accounting/debts/${id}/pay`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount_paid: amountPaid })
                });
                const result = await res.json();
                if (result.success) {
                    loadDebts();
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (err) {
                console.error("Error making payment:", err);
            }
        }

        async function deleteDebt(id) {
            if (confirm('តើអ្នកពិតជាចង់លុបទិន្នន័យនេះមែនទេ?')) {
                await fetch(`${API_BASE}/api/accounting/debts/${id}`, { method: 'DELETE' });
                loadDebts();
            }
        }

        loadDebts();
    </script>
</body>
</html>

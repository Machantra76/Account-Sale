<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធវិក្កយបត្រ និងការលក់</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kantumruy Pro', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 8px 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: 'Kantumruy Pro', sans-serif;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-family: 'Kantumruy Pro', sans-serif;
        }
        button:hover {
            background-color: #45a049;
        }
        .print-btn {
            background-color: #008CBA;
            margin-top: 10px;
        }
        .print-btn:hover {
            background-color: #007399;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>កម្មវិធីចេញវិក្កយបត្រ</h2>
        
        <div class="form-group">
            <label for="exchangeRateInput">អត្រាប្តូរប្រាក់ (រៀល / 1ដុល្លារ):</label>
            <input type="number" id="exchangeRateInput" value="4000">
        </div>

        <div class="form-group">
            <label for="itemName">ឈ្មោះទំនិញ:</label>
            <input type="text" id="itemName" placeholder="ឧ. ស្រាបៀរ, ភេសជ្ជៈ">
        </div>

        <div class="form-group">
            <label for="itemQty">ចំនួន:</label>
            <input type="number" id="itemQty" value="1">
        </div>

        <div class="form-group">
            <label for="itemUnit">ឯកតា:</label>
            <input type="text" id="itemUnit" value="កេស">
        </div>

        <div class="form-group">
            <label for="itemPrice">តម្លៃលក់ដុំ/រាយ ($):</label>
            <input type="number" id="itemPrice" step="0.01" value="10.00">
        </div>

        <button onclick="addToCartAndPrint()">ព្រិន្ទវិក្កយបត្រ (80mm)</button>
    </div>

    <script>
        // មុខងារព្រិន្ទវិក្កយបត្រស្ដង់ដារ 80mm
        function printCartInvoice(items) {
            let exchangeRate = parseFloat(document.getElementById('exchangeRateInput')?.value) || 4000;
            let invoiceNo = "INV-" + Math.floor(100000 + Math.random() * 900000);
            let currentDate = new Date().toLocaleString();

            let printWindow = window.open('', '_blank', 'height=600,width=350');
            printWindow.document.write('<html><head><title>វិក្កយបត្រលក់ (Invoice)</title>');
            printWindow.document.write(`
                <style>
                    @page { 
                        size: 80mm auto; 
                        margin: 2mm; 
                    }
                    body { 
                        font-family: 'Khmer OS Battambang', 'Kantumruy Pro', sans-serif; 
                        padding: 5px; 
                        font-size: 11px; 
                        color: #000; 
                        margin: 0; 
                        width: 72mm;
                    }
                    .invoice-header { 
                        text-align: center; 
                        border-bottom: 1.5px dashed #000; 
                        padding-bottom: 5px; 
                        margin-bottom: 5px; 
                    }
                    .invoice-header h3 { 
                        margin: 0; 
                        font-size: 13px; 
                        font-weight: bold; 
                    }
                    .invoice-info { 
                        margin-bottom: 5px; 
                        font-size: 10px; 
                    }
                    table { 
                        width: 100%; 
                        border-collapse: collapse; 
                        margin-bottom: 5px; 
                    }
                    th, td { 
                        padding: 3px 2px; 
                        border-bottom: 1.5px dashed #ddd; 
                        text-align: left; 
                        font-size: 10px; 
                    }
                    th { 
                        font-weight: bold; 
                        border-bottom: 1px solid #000; 
                    }
                    .text-center { 
                        text-align: center; 
                    }
                    .text-right { 
                        text-align: right; 
                    }
                    .totals-section { 
                        border-top: 1.5px solid #000; 
                        padding-top: 4px; 
                        margin-top: 2px; 
                        text-align: right; 
                    }
                    .totals-section div { 
                        font-weight: bold; 
                        margin-bottom: 2px; 
                    }
                    .footer-note { 
                        text-align: center; 
                        margin-top: 10px; 
                        font-size: 9px; 
                        border-top: 1px dashed #ccc;
                        padding-top: 5px;
                    }
                </style>
            `);
            printWindow.document.write('</head><body>');
            
            // Header វិក្កយបត្រ
            printWindow.document.write(`
                <div class="invoice-header">
                    <h3>វិក្កយបត្រលក់ទំនិញ (INVOICE)</h3>
                </div>
                <div class="invoice-info">
                    <div><b>លេខ:</b> ${invoiceNo}</div>
                    <div><b>កាលបរិច្ឆេទ:</b> ${currentDate}</div>
                </div>
            `);

            // តារាងបង្ហាញ ល.រ, មុខទំនិញ, ចំនួន, តម្លៃ, ទឹកប្រាក់
            printWindow.document.write('<table>');
            printWindow.document.write(`
                <tr>
                    <th style="width: 10%;" class="text-center">ល.រ</th>
                    <th style="width: 35%;">មុខទំនិញ</th>
                    <th style="width: 18%;" class="text-center">ចំនួន</th>
                    <th style="width: 17%;" class="text-right">តម្លៃ</th>
                    <th style="width: 20%;" class="text-right">ទឹកប្រាក់</th>
                </tr>
            `);
            
            let grandTotal = 0;
            items.forEach((item, index) => {
                let total = item.quantity * item.unit_price;
                grandTotal += total;
                printWindow.document.write(`
                    <tr>
                        <td class="text-center">${index + 1}</td>
                        <td><b>${item.item_name}</b></td>
                        <td class="text-center">${item.quantity} ${item.unit}</td>
                        <td class="text-right">$${item.unit_price.toFixed(2)}</td>
                        <td class="text-right">$${total.toFixed(2)}</td>
                    </tr>
                `);
            });
            
            printWindow.document.write('</table>');

            let grandTotalRiel = grandTotal * exchangeRate;

            // ទឹកប្រាក់សរុបនៅជាប់ពីក្រោមតារាង
            printWindow.document.write(`
                <div class="totals-section">
                    <div style="font-size: 12px; color: #000;">សរុបទឹកប្រាក់ ($): $${grandTotal.toFixed(2)}</div>
                    <div style="font-size: 11px; color: #000;">សរុបទឹកប្រាក់ (រៀល): ${grandTotalRiel.toLocaleString()} ៛</div>
                </div>
                <div class="footer-note">
                    អរគុណច្រើនសម្រាប់ការគាំទ្រ!<br>Thank You!
                </div>
            `);

            printWindow.document.write('</body></html>');
            printWindow.document.close();
            printWindow.focus();
            setTimeout(() => { printWindow.print(); printWindow.close(); }, 500);
        }

        // មុខងារយកទិន្នន័យពី Form មកបញ្ជូនចូល Function ព្រិន្ទ
        function addToCartAndPrint() {
            let name = document.getElementById('itemName').value || "ទំនិញទូទៅ";
            let qty = parseFloat(document.getElementById('itemQty').value) || 1;
            let unit = document.getElementById('itemUnit').value || "ដំ";
            let price = parseFloat(document.getElementById('itemPrice').value) || 0;

            let sampleItems = [
                { item_name: name, quantity: qty, unit: unit, unit_price: price }
            ];

            printCartInvoice(sampleItems);
        }
    </script>
</body>
</html>
